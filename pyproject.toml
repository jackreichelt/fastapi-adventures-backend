[project]
name = "fastapi-adventures"
version = "1"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.135.1",
    "gunicorn>=25.3.0",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.41.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
]

[tool.ruff]
line-length = 140
lint.select = ["E", "W", "F", "I", "UP"]
lint.ignore = ["D203"]
